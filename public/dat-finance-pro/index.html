<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đạt Finance Pro</title><style>html,body{margin:0;min-height:100%;background:#071425;color:#fff;font-family:system-ui}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.spin{width:42px;height:42px;border:4px solid #ffffff2b;border-top-color:#42dcc2;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}p{color:#91a4bb}</style></head><body><main id="loading"><div><div class="spin"></div><h2>Đang mở Đạt Finance Pro</h2><p>Đang tải ứng dụng quản lý tài chính...</p></div></main><script>fetch('https://raw.githubusercontent.com/thaydatdtlx-hub/quan-ly-hoc-vien-doc-lap/main/public-demos/dat-finance-pro/index.html?rev=8a67a035').then(r=>{if(!r.ok)throw new Error('Không tải được ứng dụng');return r.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(e=>{document.getElementById('loading').innerHTML='<div><h2>Không thể tải ứng dụng</h2><p>'+e.message+'</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#42dcc2;font-weight:800">Thử lại</button></div>'})</script></body></html>
