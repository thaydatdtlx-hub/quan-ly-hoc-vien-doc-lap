<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071425">
<title>Đạt Finance Pro</title>
<style>html,body{margin:0;min-height:100%;background:#071425;color:#fff;font-family:system-ui}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.spin{width:44px;height:44px;border:4px solid #ffffff2b;border-top-color:#42dcc2;border-radius:50%;animation:s .9s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}p{color:#a8b5c8;line-height:1.6}.error{max-width:520px}.error button{padding:12px 18px;border:0;border-radius:12px;background:#42dcc2;color:#05211e;font-weight:800}</style>
</head>
<body>
<main id="loading"><div><div class="spin"></div><h2>Đang mở Đạt Finance Pro</h2><p>Đang tải dữ liệu tài chính với đơn vị nhập mặc định là nghìn đồng.</p></div></main>
<script>
(async()=>{
try{
const source='https://raw.githubusercontent.com/thaydatdtlx-hub/quan-ly-hoc-vien-doc-lap/main/public-demos/dat-finance-pro/index.html?data_version=8';
let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Không tải được ứng dụng');return r.text()});
const clean=`const samples=[];
const walletBase=JSON.parse(localStorage.getItem('dat-finance-wallets-v2')||'null')||{'Tiền mặt':0,'MB Bank':0,'Vietcombank':0,'Ví điện tử':0};
let tx=JSON.parse(localStorage.getItem('dat-finance-live-v2')||'null')||samples;`;
html=html.replace(/const samples=\[[\s\S]*?\];\s*const walletBase=\{[\s\S]*?\};\s*let tx=JSON\.parse\(localStorage\.getItem\('dat-finance-tx'\)\|\|'null'\)\|\|samples;/,clean);
html=html.replace('</style>',`.tx-actions,.wallet-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.action-btn{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#132a44;color:var(--text);font-weight:700;cursor:pointer;font-size:12px}.action-btn.edit{color:#7dd3fc}.action-btn.danger{color:#ff9ba3;background:#ff6b7815;border-color:#ff6b7840}.wallet-actions{margin-top:15px}.wallet-actions .action-btn{flex:1}.delete{display:none!important}.unit-hint{display:block;margin-top:6px;color:var(--muted);font-size:12px;line-height:1.4}@media(max-width:600px){.tx{grid-template-columns:auto 1fr}.tx>div:last-child{grid-column:2}.amount{text-align:left}.tx-actions{justify-content:flex-start}.action-btn{padding:7px 11px}}</style>`);
html=html.replace('<div class="field"><label>Số tiền</label><input id="amount" type="number" inputmode="numeric" placeholder="100000"></div>','<div class="field"><label>Số tiền (.000đ)</label><input id="amount" type="text" inputmode="decimal" placeholder="Ví dụ: 250 = 250.000đ"><small class="unit-hint">Mặc định nhập theo nghìn đồng. Có thể nhập 1500 hoặc 1.500.</small></div>');
html=html.replace("function save(){localStorage.setItem('dat-finance-tx',JSON.stringify(tx))}","function save(){localStorage.setItem('dat-finance-live-v2',JSON.stringify(tx))}function saveWallets(){localStorage.setItem('dat-finance-wallets-v2',JSON.stringify(walletBase))}");
html=html.replace("let hidden=false,filter='all';",`let hidden=false,filter='all',editId=null;
function parseThousandValue(value){const s=String(value??'').trim().replace(/\s/g,'');if(!s)return NaN;if(/^\d{1,3}(\.\d{3})+$/.test(s))return Number(s.replace(/\./g,''))*1000;if(/^\d{1,3}(,\d{3})+$/.test(s))return Number(s.replace(/,/g,''))*1000;const n=Number(s.replace(',','.'));return Number.isFinite(n)?Math.round(n*1000):NaN}
function formatThousandValue(value){return new Intl.NumberFormat('vi-VN').format(Math.round(Number(value||0)/1000))}`);
html=html.replace(/function row\(t,del=true\)\{[\s\S]*?\}\nfunction escapeHtml/,`function row(t,del=true){return \`<div class="tx"><div class="tx-icon">\${icon(t.category)}</div><div class="tx-main"><b>\${escapeHtml(t.title)}</b><small>\${escapeHtml(t.category)} · \${escapeHtml(t.wallet)} · \${t.date.split('-').reverse().join('/')}</small></div><div><div class="amount \${t.type==='income'?'green':'red'}">\${t.type==='income'?'+':'-'}\${hidden?'••••••':money(t.amount)}</div>\${del?\`<div class="tx-actions"><button class="action-btn edit" data-edit="\${t.id}">Chỉnh sửa</button><button class="action-btn danger" data-delete="\${t.id}">Xóa</button></div>\`:''}</div></div>\`}
function escapeHtml`);
html=html.replace(/function renderTx\(\)\{[\s\S]*?\}\nfunction renderWallets/,`function renderTx(){const q=search.value.trim().toLowerCase();const list=tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(x=>(filter==='all'||x.type===filter)&&(!q||x.title.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)));allTx.innerHTML=list.map(x=>row(x,true)).join('')||'<p style="color:var(--muted)">Chưa có giao dịch.</p>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const item=tx.find(x=>x.id===b.dataset.delete);if(!item)return;if(!confirm('Xóa giao dịch "'+item.title+'"?'))return;tx=tx.filter(x=>x.id!==b.dataset.delete);save();render();showToast('Đã xóa giao dịch.')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const item=tx.find(x=>x.id===b.dataset.edit);if(!item)return;editId=item.id;type.value=item.type;title.value=item.title;amount.value=formatThousandValue(item.amount);category.value=item.category;date.value=item.date;syncWalletOptions(item.wallet);wallet.value=item.wallet;saveBtn.textContent='Cập nhật giao dịch';overlay.classList.add('show')})}
function renderWallets`);
html=html.replace(/function renderWallets\(t\)\{[\s\S]*?\}\nfunction renderBars/,`function syncWalletOptions(selected){const names=Object.keys(walletBase);wallet.innerHTML=names.map(n=>\`<option value="\${escapeHtml(n)}">\${escapeHtml(n)}</option>\`).join('');if(selected&&names.includes(selected))wallet.value=selected}
function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function renderWallets(t){const adj={...walletBase};tx.forEach(x=>adj[x.wallet]=(adj[x.wallet]||0)+(x.type==='income'?Number(x.amount):-Number(x.amount)));const emo={'Tiền mặt':'💵','MB Bank':'🏦','Vietcombank':'🏛️','Ví điện tử':'📱'};wallets.innerHTML=Object.entries(adj).map(([n,v])=>\`<div class="card wallet"><div class="wallet-icon">\${emo[n]||'💳'}</div><strong>\${hidden?'••••••':money(v)}</strong><small>\${escapeHtml(n)}</small><div class="wallet-actions"><button class="action-btn edit" data-wallet-edit="\${encodeURIComponent(n)}">Chỉnh sửa</button><button class="action-btn danger" data-wallet-delete="\${encodeURIComponent(n)}">Xóa</button></div></div>\`).join('');syncWalletOptions(wallet.value);document.querySelectorAll('[data-wallet-edit]').forEach(b=>b.onclick=()=>{const oldName=decodeURIComponent(b.dataset.walletEdit);const entered=prompt('Tên tài khoản',oldName);if(entered===null)return;const newName=entered.trim();if(!newName){alert('Tên tài khoản không được để trống.');return}if(newName!==oldName&&Object.prototype.hasOwnProperty.call(walletBase,newName)){alert('Tên tài khoản đã tồn tại.');return}const value=prompt('Số dư đầu kỳ (.000đ) của '+newName,formatThousandValue(walletBase[oldName]||0));if(value===null)return;const opening=parseThousandValue(value);if(!Number.isFinite(opening)){alert('Số dư không hợp lệ. Ví dụ: nhập 1500 để được 1.500.000đ.');return}if(newName!==oldName){delete walletBase[oldName];walletBase[newName]=opening;tx.forEach(x=>{if(x.wallet===oldName)x.wallet=newName})}else walletBase[oldName]=opening;saveWallets();save();render();showToast('Đã cập nhật tài khoản.')});document.querySelectorAll('[data-wallet-delete]').forEach(b=>b.onclick=()=>{const name=decodeURIComponent(b.dataset.walletDelete);if(Object.keys(walletBase).length<=1){alert('Phải giữ lại ít nhất một tài khoản.');return}if(tx.some(x=>x.wallet===name)){alert('Tài khoản này đang có giao dịch. Hãy chỉnh sửa hoặc xóa các giao dịch liên quan trước.');return}if(!confirm('Xóa tài khoản "'+name+'"?'))return;delete walletBase[name];saveWallets();render();showToast('Đã xóa tài khoản.')})}
function renderBars`);
html=html.replace(/function renderBars\(\)\{[\s\S]*?\}\nfunction renderBudgets/,`function renderBars(){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}const vals=days.map(d=>tx.filter(t=>t.date===d).reduce((s,t)=>s+(t.type==='income'?Number(t.amount):-Number(t.amount)),0));const max=Math.max(1,...vals.map(Math.abs));bars.innerHTML=days.map((d,i)=>\`<div class="bar-wrap"><div class="bar" style="height:\${Math.max(4,Math.abs(vals[i])/max*100)}%;opacity:\${vals[i]===0?.18:1}"></div><span>\${['T2','T3','T4','T5','T6','T7','CN'][i]}</span></div>\`).join('')}
function renderBudgets`);
html=html.replace(/function renderBudgets\(\)\{[\s\S]*?\}\nfunction go/,`function renderBudgets(){budgets.innerHTML='<div style="padding:24px 8px;text-align:center;color:var(--muted)"><b style="display:block;color:var(--text);margin-bottom:5px">Chưa có ngân sách</b>Dữ liệu ngân sách mẫu đã được xóa.</div>'}
function go`);
html=html.replace("addBtn.onclick=()=>overlay.classList.add('show');closeBtn.onclick=()=>overlay.classList.remove('show');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')};date.value=new Date().toISOString().slice(0,10);",`addBtn.onclick=()=>{editId=null;type.value='expense';title.value='';amount.value='';category.selectedIndex=0;date.value=new Date().toISOString().slice(0,10);syncWalletOptions();saveBtn.textContent='Lưu giao dịch';overlay.classList.add('show')};closeBtn.onclick=()=>{overlay.classList.remove('show');editId=null;saveBtn.textContent='Lưu giao dịch'};overlay.onclick=e=>{if(e.target===overlay){overlay.classList.remove('show');editId=null;saveBtn.textContent='Lưu giao dịch'}};date.value=new Date().toISOString().slice(0,10);`);
html=html.replace(/saveBtn\.onclick=\(\)=>\{[\s\S]*?\};\neyeBtn\.onclick/,`saveBtn.onclick=()=>{const a=parseThousandValue(amount.value);if(!title.value.trim()||!Number.isFinite(a)||a<=0){alert('Vui lòng nhập nội dung và số tiền theo đơn vị .000đ. Ví dụ: nhập 250 để được 250.000đ.');return}const data={type:type.value,title:title.value.trim(),amount:a,category:category.value,wallet:wallet.value,date:date.value||new Date().toISOString().slice(0,10)};if(editId){const index=tx.findIndex(x=>x.id===editId);if(index>=0)tx[index]={...tx[index],...data};showToast('Đã cập nhật giao dịch.')}else{tx.unshift({id:Date.now().toString(),...data});showToast('Đã lưu giao dịch.')}save();editId=null;title.value='';amount.value='';saveBtn.textContent='Lưu giao dịch';overlay.classList.remove('show');render();go('transactions')};
eyeBtn.onclick`);
html=html.replace('Khôi phục dữ liệu mẫu</button>','Xóa dữ liệu và làm mới</button>');
html=html.replace("resetBtn.onclick=()=>{if(confirm('Khôi phục dữ liệu mẫu?')){tx=structuredClone(samples);save();render();go('home')}}","resetBtn.onclick=()=>{if(confirm('Xóa toàn bộ giao dịch và đưa số dư đầu kỳ về 0 đồng?')){tx=[];Object.keys(walletBase).forEach(k=>walletBase[k]=0);save();saveWallets();render();go('home');showToast('Đã làm mới toàn bộ dữ liệu.')}}");
html=html.replace('↗ 8,4% so với tháng trước','Dữ liệu được tính từ giao dịch của anh');
html=html.replace('18,4 triệu','0 đồng');
html=html.replace('<b>Tốt</b>','<b>Chưa có dữ liệu</b>');
html=html.replace('Bạn đang duy trì dòng tiền dương. Hãy ưu tiên hoàn thành quỹ dự phòng trước khi tăng tỷ trọng đầu tư.','Nhập giao dịch để bắt đầu phân tích tình hình tài chính.');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').innerHTML='<div class="error"><h2>Không thể mở Đạt Finance Pro</h2><p>'+String(e.message||e)+'</p><button onclick="location.reload()">Thử lại</button></div>'}
})();
</script>
</body>
</html>
