name: Unify admin toolbar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-admin-toolbar.yml

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace toolbar markup and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          toolbar = '''      <section class="toolbar admin-toolbar" aria-label="Công cụ quản lý học viên">
        <input id="search" aria-label="Tìm kiếm học viên" placeholder="Tìm tên, CCCD, điện thoại, mã học viên">
        <select id="ownerFilter" class="hidden" aria-label="Lọc tài khoản"></select>

        <button id="addStudentBtn" class="primary toolbar-action toolbar-action--primary" type="button">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM19 8v6M16 11h6"/></svg></span>
          <span class="toolbar-action__copy"><strong>THÊM HỌC VIÊN</strong><small>Tạo hồ sơ mới</small></span>
        </button>

        <a class="schedule-link toolbar-action toolbar-action--violet" href="/lich-dao-tao.html">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M13 14h3M8 18h3"/></svg></span>
          <span class="toolbar-action__copy"><strong>LỊCH ĐÀO TẠO</strong><small>Sắp xếp lịch học</small></span>
        </a>

        <a class="schedule-link question-bank-link toolbar-action toolbar-action--green" href="/600-cau-hoi.html">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5Z"/><path d="M7 7h2M7 10h2M15 7h2M15 10h2"/></svg></span>
          <span class="toolbar-action__copy"><strong>HỌC LÝ THUYẾT</strong><small>Ôn tập 600 câu</small></span>
        </a>

        <a class="schedule-link refresh-public-link toolbar-action toolbar-action--amber" href="/bo-tuc-tay-lai.html" target="_blank" rel="noopener">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17 3 15v-4l2-5h14l2 5v4l-2 2Z"/><path d="M5 11h14M7 17v2M17 17v2"/><circle cx="7" cy="14" r="1"/><circle cx="17" cy="14" r="1"/></svg></span>
          <span class="toolbar-action__copy"><strong>TRANG ĐĂNG KÝ BỔ TÚC</strong><small>Mở trang đăng ký</small></span>
        </a>

        <button id="importBtn" class="data-action data-import admin-only hidden toolbar-action toolbar-action--mint" type="button" title="Chỉ nhận file Excel .xlsx">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span>
          <span class="toolbar-action__copy"><strong>NHẬP FILE</strong><small>Chọn file .xlsx</small></span>
        </button>

        <button id="exportBtn" class="data-action data-export toolbar-action toolbar-action--blue" type="button" title="Xuất file Excel .xlsx">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg></span>
          <span class="toolbar-action__copy"><strong>XUẤT FILE</strong><small>Mở / lưu .xlsx</small></span>
        </button>

        <button id="usersBtn" class="admin-only hidden toolbar-action toolbar-action--slate" type="button">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 11a4 4 0 0 0 0-8M23 21v-2a4 4 0 0 0-3-3.87"/></svg></span>
          <span class="toolbar-action__copy"><strong>TÀI KHOẢN QUẢN LÝ</strong><small>Phân quyền truy cập</small></span>
        </button>

        <button id="publicTheoryAccountsBtn" class="admin-only hidden toolbar-action toolbar-action--cyan" type="button">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
          <span class="toolbar-action__copy"><strong>NGƯỜI HỌC BÊN NGOÀI</strong><small>Tài khoản học 600 câu</small></span>
        </button>

        <button id="attendanceBtn" class="attendance-toolbar-btn admin-only hidden toolbar-action toolbar-action--teal" type="button">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span>
          <span class="toolbar-action__copy"><strong>ĐIỂM DANH</strong><small>Ghi nhận buổi học</small></span>
        </button>

        <button id="adminReportBtn" class="report-toolbar-btn admin-only hidden toolbar-action toolbar-action--indigo" type="button">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
          <span class="toolbar-action__copy"><strong>BÁO CÁO ADMIN</strong><small>Tổng hợp dữ liệu</small></span>
        </button>

        <button id="drivingRefreshAdminBtn" class="refresh-admin-btn admin-only hidden toolbar-action toolbar-action--rose" type="button">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17 3 15v-4l2-5h14l2 5v4l-2 2Z"/><path d="M5 11h14M7 17v2M17 17v2"/><circle cx="7" cy="14" r="1"/><circle cx="17" cy="14" r="1"/></svg></span>
          <span class="toolbar-action__copy"><strong>ĐĂNG KÝ BỔ TÚC</strong><small id="drivingRefreshToolbarCount">Khách mới</small></span>
        </button>

        <button id="operationsBtn" class="operations-btn admin-only hidden toolbar-action toolbar-action--emerald" type="button">
          <span class="toolbar-action__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></span>
          <span class="toolbar-action__copy"><strong>THÙNG RÁC &amp; NHẬT KÝ</strong><small id="trashToolbarCount">An toàn dữ liệu</small></span>
        </button>

        <input id="dataFile" class="hidden" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="Chọn file Excel .xlsx để nhập dữ liệu">
      </section>'''

          pattern = re.compile(r'      <section class="toolbar">.*?      </section>', re.S)
          index, count = pattern.subn(toolbar, index, count=1)
          if count != 1:
              raise SystemExit(f'Expected one toolbar section, replaced {count}')
          index = index.replace('/professional.css?v=15', '/professional.css?v=16')
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('professional.css')
          css = css_path.read_text(encoding='utf-8')
          start = '/* ADMIN TOOLBAR UNIFIED V16 */'
          if start in css:
              css = css.split(start)[0].rstrip() + '\n'

          css += r'''

/* ADMIN TOOLBAR UNIFIED V16 */
#app .admin-toolbar{
  --toolbar-border:#d8e4ef;
  display:grid;
  grid-template-columns:minmax(270px,1.45fr) minmax(180px,.8fr) repeat(4,minmax(170px,1fr));
  gap:12px;
  align-items:stretch;
  padding:16px;
  border:1px solid #d7e4ef;
  border-radius:22px;
  background:rgba(255,255,255,.9);
  box-shadow:0 16px 42px rgba(27,66,102,.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
#app .admin-toolbar>*{min-width:0}
#app .admin-toolbar>input:not(.hidden),
#app .admin-toolbar>select:not(.hidden){
  min-height:74px;
  height:74px;
  padding:0 16px;
  border:1px solid var(--toolbar-border);
  border-radius:15px;
  background:#f6f9fc;
  color:#183858;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  font-size:14px;
  font-weight:600;
  box-shadow:none;
}
#app .admin-toolbar>input::placeholder{color:#8290a0;opacity:1}
#app .admin-toolbar>input:focus,
#app .admin-toolbar>select:focus{
  border-color:#73a8e8;
  background:#fff;
  box-shadow:0 0 0 4px rgba(35,111,211,.1);
}
#app .admin-toolbar .toolbar-action{
  --action-color:#315d87;
  --action-bg:#f8fbfe;
  --action-icon-bg:#e8f0f8;
  display:flex!important;
  min-width:0!important;
  min-height:74px!important;
  height:auto;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:11px!important;
  padding:12px 14px!important;
  border:1px solid color-mix(in srgb,var(--action-color) 25%,#dce6ef)!important;
  border-radius:15px!important;
  background:var(--action-bg)!important;
  color:var(--action-color)!important;
  font-family:Inter,"Segoe UI",Arial,sans-serif!important;
  text-align:left!important;
  text-decoration:none!important;
  box-shadow:0 3px 10px rgba(25,61,93,.045)!important;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease!important;
}
#app .admin-toolbar .toolbar-action:hover{
  transform:translateY(-2px)!important;
  border-color:color-mix(in srgb,var(--action-color) 48%,#dce6ef)!important;
  box-shadow:0 12px 24px rgba(25,61,93,.13)!important;
}
#app .admin-toolbar .toolbar-action:active{transform:translateY(0)!important}
#app .admin-toolbar .toolbar-action>.toolbar-action__icon{
  display:grid!important;
  width:38px!important;
  height:38px!important;
  min-width:38px!important;
  flex:0 0 38px!important;
  place-items:center!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:11px!important;
  background:var(--action-icon-bg)!important;
  color:var(--action-color)!important;
  font-size:0!important;
  line-height:1!important;
  box-shadow:none!important;
}
#app .admin-toolbar .toolbar-action__icon svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#app .admin-toolbar .toolbar-action>.toolbar-action__copy{
  display:grid!important;
  width:auto!important;
  height:auto!important;
  min-width:0!important;
  flex:1 1 auto!important;
  place-items:initial!important;
  align-content:center!important;
  gap:3px!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  color:inherit!important;
  font-size:inherit!important;
  line-height:1.2!important;
  box-shadow:none!important;
}
#app .admin-toolbar .toolbar-action__copy strong{
  display:block!important;
  margin:0!important;
  color:inherit!important;
  font-size:11px!important;
  font-weight:850!important;
  line-height:1.25!important;
  letter-spacing:.015em!important;
  text-transform:uppercase!important;
  overflow-wrap:anywhere;
}
#app .admin-toolbar .toolbar-action__copy small{
  display:block!important;
  margin:0!important;
  color:#72849a!important;
  font-size:9px!important;
  font-weight:650!important;
  line-height:1.25!important;
  letter-spacing:0!important;
  overflow-wrap:anywhere;
}
#app .admin-toolbar .toolbar-action--primary{--action-color:#fff;--action-bg:linear-gradient(135deg,#1762d6,#1e55c2);--action-icon-bg:rgba(255,255,255,.16);border-color:#2d69d5!important;box-shadow:0 9px 20px rgba(23,92,211,.24)!important}
#app .admin-toolbar .toolbar-action--primary .toolbar-action__copy small{color:rgba(255,255,255,.78)!important}
#app .admin-toolbar .toolbar-action--violet{--action-color:#6848ba;--action-bg:#f6f1ff;--action-icon-bg:#e8ddff}
#app .admin-toolbar .toolbar-action--green{--action-color:#087a5d;--action-bg:#effbf7;--action-icon-bg:#d9f3e9}
#app .admin-toolbar .toolbar-action--amber{--action-color:#8a5a16;--action-bg:#fff9ee;--action-icon-bg:#f9e8c8}
#app .admin-toolbar .toolbar-action--mint{--action-color:#087c5c;--action-bg:#f0fbf7;--action-icon-bg:#d8f3e8}
#app .admin-toolbar .toolbar-action--blue{--action-color:#1766bd;--action-bg:#f0f7ff;--action-icon-bg:#dcecff}
#app .admin-toolbar .toolbar-action--slate{--action-color:#35516d;--action-bg:#f5f8fb;--action-icon-bg:#e3ebf2}
#app .admin-toolbar .toolbar-action--cyan{--action-color:#08748a;--action-bg:#effbfe;--action-icon-bg:#d8f1f6}
#app .admin-toolbar .toolbar-action--teal{--action-color:#176d75;--action-bg:#f0faf9;--action-icon-bg:#dcefed}
#app .admin-toolbar .toolbar-action--indigo{--action-color:#334f91;--action-bg:#f2f5fc;--action-icon-bg:#dfe6f7}
#app .admin-toolbar .toolbar-action--rose{--action-color:#9b3f55;--action-bg:#fff4f6;--action-icon-bg:#f8dfe5}
#app .admin-toolbar .toolbar-action--emerald{--action-color:#087a58;--action-bg:#f0faf5;--action-icon-bg:#dcf3e7}

@media(max-width:1500px){
  #app .admin-toolbar{grid-template-columns:minmax(250px,1.35fr) minmax(180px,.8fr) repeat(3,minmax(165px,1fr))}
}
@media(max-width:1180px){
  #app .admin-toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}
  #app .admin-toolbar>#search{grid-column:span 2}
}
@media(max-width:760px){
  #app .admin-toolbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:11px;border-radius:17px}
  #app .admin-toolbar>#search,
  #app .admin-toolbar>#ownerFilter{grid-column:1/-1}
  #app .admin-toolbar>input:not(.hidden),
  #app .admin-toolbar>select:not(.hidden){min-height:52px;height:52px}
  #app .admin-toolbar .toolbar-action{min-height:66px!important;padding:10px 11px!important;gap:9px!important}
  #app .admin-toolbar .toolbar-action>.toolbar-action__icon{width:34px!important;height:34px!important;min-width:34px!important;flex-basis:34px!important}
  #app .admin-toolbar .toolbar-action__icon svg{width:19px;height:19px}
  #app .admin-toolbar .toolbar-action__copy strong{font-size:10px!important}
  #app .admin-toolbar .toolbar-action__copy small{font-size:8px!important}
}
@media(max-width:460px){
  #app .admin-toolbar{grid-template-columns:1fr}
  #app .admin-toolbar>#search,
  #app .admin-toolbar>#ownerFilter{grid-column:auto}
  #app .admin-toolbar .toolbar-action{min-height:62px!important}
}
'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate changed files
        run: |
          grep -q 'ADMIN TOOLBAR UNIFIED V16' professional.css
          grep -q 'toolbar-action__icon' index.html
          grep -q '/professional.css?v=16' index.html

      - name: Commit toolbar redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html professional.css
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Đồng bộ kiểu chữ và icon thanh công cụ Admin"
          git push
