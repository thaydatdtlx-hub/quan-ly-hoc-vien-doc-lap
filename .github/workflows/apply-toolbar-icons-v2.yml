name: Apply professional toolbar icons v2

on:
  push:
    branches: [main]
    paths:
      - .github/toolbar-icons-v2-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace toolbar with professional SVG icon system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          toolbar = '''      <section class="toolbar admin-toolbar-v2" aria-label="Công cụ quản lý học viên">
        <input id="search" aria-label="Tìm kiếm học viên" placeholder="Tìm tên, CCCD, điện thoại, mã học viên">
        <select id="ownerFilter" class="hidden" aria-label="Lọc tài khoản"></select>

        <button id="addStudentBtn" class="primary toolbar-card tone-primary" type="button">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M19 8v6M16 11h6"/></svg></span>
          <span class="toolbar-card__copy"><strong>Thêm học viên</strong><small>Tạo hồ sơ mới</small></span>
        </button>

        <a class="schedule-link toolbar-card tone-violet" href="/lich-dao-tao.html">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M13 14h3M8 18h3"/></svg></span>
          <span class="toolbar-card__copy"><strong>Lịch đào tạo</strong><small>Sắp xếp lịch học</small></span>
        </a>

        <a class="schedule-link question-bank-link toolbar-card tone-green" href="/600-cau-hoi.html">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5Z"/><path d="M7 7h2M7 10h2M15 7h2M15 10h2"/></svg></span>
          <span class="toolbar-card__copy"><strong>Học lý thuyết</strong><small>Ôn tập 600 câu</small></span>
        </a>

        <a class="schedule-link refresh-public-link toolbar-card tone-amber" href="/bo-tuc-tay-lai.html" target="_blank" rel="noopener">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17 3 15v-4l2-5h14l2 5v4l-2 2Z"/><path d="M5 11h14M7 17v2M17 17v2"/><circle cx="7" cy="14" r="1"/><circle cx="17" cy="14" r="1"/></svg></span>
          <span class="toolbar-card__copy"><strong>Trang đăng ký bổ túc</strong><small>Mở trang công khai</small></span>
        </a>

        <button id="importBtn" class="data-action data-import admin-only hidden toolbar-card tone-mint" type="button" title="Chỉ nhận file Excel .xlsx">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M12 18V11M8.5 14.5 12 11l3.5 3.5"/></svg></span>
          <span class="toolbar-card__copy"><strong>Nhập file</strong><small>Chọn file .xlsx</small></span>
        </button>

        <button id="exportBtn" class="data-action data-export toolbar-card tone-blue" type="button" title="Xuất file Excel .xlsx">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M12 11v7M8.5 14.5 12 18l3.5-3.5"/></svg></span>
          <span class="toolbar-card__copy"><strong>Xuất file</strong><small>Mở hoặc lưu .xlsx</small></span>
        </button>

        <button id="usersBtn" class="admin-only hidden toolbar-card tone-slate" type="button">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M17 11a4 4 0 0 0 0-7M22 21v-2a5 5 0 0 0-3-4.58"/></svg></span>
          <span class="toolbar-card__copy"><strong>Tài khoản quản lý</strong><small>Phân quyền truy cập</small></span>
        </button>

        <button id="publicTheoryAccountsBtn" class="admin-only hidden toolbar-card tone-cyan" type="button">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/><path d="M16.5 7.5h2M17.5 6.5v2"/></svg></span>
          <span class="toolbar-card__copy"><strong>Người học bên ngoài</strong><small>Tài khoản học 600 câu</small></span>
        </button>

        <button id="attendanceBtn" class="attendance-toolbar-btn admin-only hidden toolbar-card tone-teal" type="button">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3.5h6v3H9zM8 12l2.5 2.5L16 9"/></svg></span>
          <span class="toolbar-card__copy"><strong>Điểm danh</strong><small>Ghi nhận buổi học</small></span>
        </button>

        <button id="adminReportBtn" class="report-toolbar-btn admin-only hidden toolbar-card tone-indigo" type="button">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/><path d="m5 8 4-3 5 5 6-6"/></svg></span>
          <span class="toolbar-card__copy"><strong>Báo cáo Admin</strong><small>Tổng hợp dữ liệu</small></span>
        </button>

        <button id="drivingRefreshAdminBtn" class="refresh-admin-btn admin-only hidden toolbar-card tone-rose" type="button">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17 3 15v-4l2-5h14l2 5v4l-2 2Z"/><path d="M5 11h14M7 17v2M17 17v2"/><circle cx="7" cy="14" r="1"/><circle cx="17" cy="14" r="1"/><path d="M18 3v4M16 5h4"/></svg></span>
          <span class="toolbar-card__copy"><strong>Đăng ký bổ túc</strong><small id="drivingRefreshToolbarCount">Khách mới</small></span>
        </button>

        <button id="operationsBtn" class="operations-btn admin-only hidden toolbar-card tone-emerald" type="button">
          <span class="toolbar-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></span>
          <span class="toolbar-card__copy"><strong>Thùng rác &amp; nhật ký</strong><small id="trashToolbarCount">An toàn dữ liệu</small></span>
        </button>

        <input id="dataFile" class="hidden" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="Chọn file Excel .xlsx để nhập dữ liệu">
      </section>'''

          pattern = re.compile(r'      <section class="toolbar(?: admin-toolbar-v2)?"[^>]*>.*?      </section>', re.S)
          index, count = pattern.subn(toolbar, index, count=1)
          if count != 1:
              raise SystemExit(f'Could not replace toolbar section: {count}')

          old_link = '<link rel="stylesheet" href="/admin-toolbar-unified.css?v=1">'
          new_link = '<link rel="stylesheet" href="/admin-toolbar-icons-v2.css?v=2">'
          if old_link in index:
              index = index.replace(old_link, new_link, 1)
          elif new_link not in index:
              index = index.replace('</head>', f'  {new_link}\n</head>', 1)
          index_path.write_text(index, encoding='utf-8')

          css = r'''
#app .admin-toolbar-v2{
  display:grid;
  grid-template-columns:minmax(270px,1.4fr) minmax(180px,.8fr) repeat(4,minmax(170px,1fr));
  gap:12px;
  align-items:stretch;
  padding:16px;
  border:1px solid #d7e4ef;
  border-radius:22px;
  background:rgba(255,255,255,.94);
  box-shadow:0 16px 42px rgba(27,66,102,.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
#app .admin-toolbar-v2>*{min-width:0}
#app .admin-toolbar-v2>input:not(.hidden),
#app .admin-toolbar-v2>select:not(.hidden){
  min-height:76px;
  height:76px;
  padding:0 16px;
  border:1px solid #d8e4ef;
  border-radius:16px;
  background:#f6f9fc;
  color:#173858;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  font-size:14px;
  font-weight:600;
  box-shadow:none;
}
#app .admin-toolbar-v2>input::placeholder{color:#8391a1;opacity:1}
#app .admin-toolbar-v2>input:focus,
#app .admin-toolbar-v2>select:focus{border-color:#79a9e4;background:#fff;box-shadow:0 0 0 4px rgba(38,111,201,.1)}
#app .admin-toolbar-v2 .toolbar-card{
  --tone:#315d87;
  --surface:#f8fbfe;
  --icon-bg:#e8f0f8;
  --border:#d8e4ef;
  display:flex!important;
  min-width:0!important;
  min-height:76px!important;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:12px!important;
  padding:12px 14px!important;
  border:1px solid var(--border)!important;
  border-radius:16px!important;
  background:var(--surface)!important;
  color:var(--tone)!important;
  font-family:Inter,"Segoe UI",Arial,sans-serif!important;
  text-align:left!important;
  text-decoration:none!important;
  box-shadow:0 4px 12px rgba(25,61,93,.055)!important;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease!important;
}
#app .admin-toolbar-v2 .toolbar-card:hover{transform:translateY(-2px)!important;border-color:var(--tone)!important;box-shadow:0 13px 26px rgba(25,61,93,.14)!important}
#app .admin-toolbar-v2 .toolbar-card:active{transform:translateY(0)!important}
#app .admin-toolbar-v2 .toolbar-card__icon{
  display:grid!important;
  width:42px!important;
  height:42px!important;
  min-width:42px!important;
  flex:0 0 42px!important;
  place-items:center!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:12px!important;
  background:var(--icon-bg)!important;
  color:var(--tone)!important;
  box-shadow:none!important;
}
#app .admin-toolbar-v2 .toolbar-card__icon svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#app .admin-toolbar-v2 .toolbar-card__copy{
  display:grid!important;
  min-width:0!important;
  flex:1 1 auto!important;
  gap:3px!important;
  margin:0!important;
  padding:0!important;
  background:transparent!important;
  color:inherit!important;
}
#app .admin-toolbar-v2 .toolbar-card__copy strong{
  display:block!important;
  margin:0!important;
  color:inherit!important;
  font-size:11px!important;
  font-weight:850!important;
  line-height:1.25!important;
  letter-spacing:.015em!important;
  text-transform:uppercase!important;
  overflow-wrap:anywhere;
}
#app .admin-toolbar-v2 .toolbar-card__copy small{
  display:block!important;
  margin:0!important;
  color:#71849a!important;
  font-size:9px!important;
  font-weight:650!important;
  line-height:1.25!important;
  overflow-wrap:anywhere;
}
#app .admin-toolbar-v2 .tone-primary{--tone:#fff;--surface:linear-gradient(135deg,#1762d6,#1f55c2);--icon-bg:rgba(255,255,255,.16);--border:#2d69d5;box-shadow:0 10px 22px rgba(23,92,211,.24)!important}
#app .admin-toolbar-v2 .tone-primary .toolbar-card__copy small{color:rgba(255,255,255,.78)!important}
#app .admin-toolbar-v2 .tone-violet{--tone:#6848ba;--surface:#f6f1ff;--icon-bg:#e8ddff;--border:#d8c8fa}
#app .admin-toolbar-v2 .tone-green{--tone:#087a5d;--surface:#effbf7;--icon-bg:#d9f3e9;--border:#c8eadc}
#app .admin-toolbar-v2 .tone-amber{--tone:#8a5a16;--surface:#fff9ee;--icon-bg:#f9e8c8;--border:#edd6a8}
#app .admin-toolbar-v2 .tone-mint{--tone:#087c5c;--surface:#f0fbf7;--icon-bg:#d8f3e8;--border:#c7e9dc}
#app .admin-toolbar-v2 .tone-blue{--tone:#1766bd;--surface:#f0f7ff;--icon-bg:#dcecff;--border:#c6dcf7}
#app .admin-toolbar-v2 .tone-slate{--tone:#35516d;--surface:#f5f8fb;--icon-bg:#e3ebf2;--border:#d6e0e9}
#app .admin-toolbar-v2 .tone-cyan{--tone:#08748a;--surface:#effbfe;--icon-bg:#d8f1f6;--border:#c4e7ee}
#app .admin-toolbar-v2 .tone-teal{--tone:#176d75;--surface:#f0faf9;--icon-bg:#dcefed;--border:#c9e4e1}
#app .admin-toolbar-v2 .tone-indigo{--tone:#334f91;--surface:#f2f5fc;--icon-bg:#dfe6f7;--border:#cfd9ef}
#app .admin-toolbar-v2 .tone-rose{--tone:#9b3f55;--surface:#fff4f6;--icon-bg:#f8dfe5;--border:#efcbd4}
#app .admin-toolbar-v2 .tone-emerald{--tone:#087a58;--surface:#f0faf5;--icon-bg:#dcf3e7;--border:#c9e8da}
@media(max-width:1500px){#app .admin-toolbar-v2{grid-template-columns:minmax(250px,1.35fr) minmax(180px,.8fr) repeat(3,minmax(165px,1fr))}}
@media(max-width:1180px){#app .admin-toolbar-v2{grid-template-columns:repeat(3,minmax(0,1fr))}#app .admin-toolbar-v2>#search{grid-column:span 2}}
@media(max-width:760px){
  #app .admin-toolbar-v2{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:11px;border-radius:18px}
  #app .admin-toolbar-v2>#search,#app .admin-toolbar-v2>#ownerFilter{grid-column:1/-1}
  #app .admin-toolbar-v2>input:not(.hidden),#app .admin-toolbar-v2>select:not(.hidden){min-height:54px;height:54px}
  #app .admin-toolbar-v2 .toolbar-card{min-height:68px!important;padding:10px 11px!important;gap:9px!important}
  #app .admin-toolbar-v2 .toolbar-card__icon{width:36px!important;height:36px!important;min-width:36px!important;flex-basis:36px!important;border-radius:10px!important}
  #app .admin-toolbar-v2 .toolbar-card__icon svg{width:19px;height:19px}
  #app .admin-toolbar-v2 .toolbar-card__copy strong{font-size:10px!important}
  #app .admin-toolbar-v2 .toolbar-card__copy small{font-size:8px!important}
}
@media(max-width:460px){#app .admin-toolbar-v2{grid-template-columns:1fr}#app .admin-toolbar-v2>#search,#app .admin-toolbar-v2>#ownerFilter{grid-column:auto}}
'''
          Path('admin-toolbar-icons-v2.css').write_text(css.strip()+'\n', encoding='utf-8')
          PY

      - name: Validate markup and stylesheet
        run: |
          grep -q 'admin-toolbar-v2' index.html
          grep -q 'toolbar-card__icon' index.html
          grep -q 'admin-toolbar-icons-v2.css?v=2' index.html
          grep -q 'stroke-width:1.8' admin-toolbar-icons-v2.css

      - name: Commit professional icon system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin-toolbar-icons-v2.css
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Thay bộ icon chuyên nghiệp cho thanh công cụ"
          git push
