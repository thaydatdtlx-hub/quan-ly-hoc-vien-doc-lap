name: Verify production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify emergency login recovery is present
        run: |
          grep -F '/rpc-preflight.js?v=20260902-1' dist/index.html
          grep -F 'PROXY_MARKER="same-origin-v4"' dist/rpc-preflight.js
          grep -F 'version:"20260902-1"' dist/rpc-preflight.js
